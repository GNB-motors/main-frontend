name: Frontend CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, test, build, bundle budget
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # No lockfile is committed (frontend/.gitignore lists package-lock.json),
      # so `npm ci` cannot run. HUSKY=0 skips installing git hooks on the runner.
      - name: Install dependencies
        run: npm install --no-audit --no-fund
        env:
          HUSKY: '0'

      # The same command developers run: eslint (with the warning ratchet),
      # vitest, vite build, then the main-chunk bundle budget.
      - name: Build
        run: npm run build
