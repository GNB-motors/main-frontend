name: Frontend CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, test, build, bundle budget
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # No lockfile is committed (frontend/.gitignore lists package-lock.json),
      # so `npm ci` cannot run. HUSKY=0 skips installing git hooks on the runner.
      - name: Install dependencies
        run: npm install --no-audit --no-fund
        env:
          HUSKY: '0'

      # The same checks as `npm run build` (keep the two in step), run one per
      # step so a failure names itself, with tests measuring coverage.
      - name: Lint
        run: npm run lint

      - name: Test (with coverage)
        run: npm run test:coverage

      - name: Build
        run: npx vite build

      - name: Bundle budget
        run: node scripts/check-bundle.mjs

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/
          if-no-files-found: ignore
