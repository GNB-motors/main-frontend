server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Security headers (repeated in the assets location below — nginx only
    # inherits add_header when a location defines none of its own)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;
    # Report-only until the API/connect sources are verified against production
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' https://maps.googleapis.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.googleapis.com https://*.gstatic.com; connect-src 'self' https://*.googleapis.com https://*.gstatic.com https://*.sentry.io; font-src 'self' data:; frame-src https://www.google.com; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

    # Gzip for static assets
    gzip on;
    gzip_vary on;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/xml+rss
        application/json
        image/svg+xml;

    # Cache hashed static assets (Vite emits files like assets/index-abc123.js)
    location ~* \.(?:js|css|woff2?|ttf|eot|ico|svg|png|jpg|jpeg|webp|gif)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;
        try_files $uri =404;
    }

    # SSE streams must NOT go through the generic /api/ block: its defaults
    # (proxy_buffering on, proxy_read_timeout 60s) buffer text/event-stream
    # and the browser receives zero events. This more-specific block is
    # matched first. Path mapping mirrors /api/ -> / (so /api/live/stream
    # reaches the backend as /live/stream — test through nginx in Docker,
    # never against localhost:3000).
    location /api/live/ {
        proxy_pass http://app:3000/live/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Streaming: flush every event to the client immediately.
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        # SSE connections are long-lived — the 60 s default kills them.
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_set_header Connection "";
    }

    # Proxy API calls to the Node backend. The backend is expected to run on
    # the same Docker network / host at port 3000.
    location /api/ {
        proxy_pass http://app:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback: every unmatched route returns index.html so React Router
    # handles client-side routing.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
