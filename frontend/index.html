<!doctype html>
<html lang="en">
  <head>
    <!--
      Password-reset links carry a one-time token in the FRAGMENT
      (/reset-password#token=…); the fragment is never sent to a server. This
      script is the FIRST thing in <head>, so it runs before any image, script
      or telemetry can see the URL: the token is moved to
      window.__gnbResetToken (and to sessionStorage, key 'gnb.resetToken') and
      taken out of the address bar. The address bar becomes exactly
      /reset-password — the query string and the fragment go too. The old
      /reset-password?token=… link still works. The same logic lives in
      src/pages/ResetPassword/resetTokenScrub.js (and is tested there).
    -->
    <script>
      (() => {
        try {
          if (window.location.pathname === '/reset-password') {
            const readToken = (raw) => {
              try {
                const value = String(raw || '').replace(/^[#?]/, '');
                const query = value.includes('?') ? value.slice(value.indexOf('?') + 1) : value;
                return (new URLSearchParams(query).get('token') || '').trim();
              } catch (e) {
                return '';
              }
            };
            const token =
              readToken(window.location.hash) || readToken(window.location.search);
            if (token) {
              try {
                window.sessionStorage.setItem('gnb.resetToken', token);
              } catch (e) {
                /* storage disabled: the window copy is the fallback */
              }
              window.__gnbResetToken = token;
              window.history.replaceState(window.history.state, '', '/reset-password');
            }
          }
        } catch (e) {
          /* never break the app over this */
        }
      })();
    </script>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/gnb-truck.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- The reset token must not travel to anyone else. -->
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <title>TMS — Fleet Management</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
