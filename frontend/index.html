<!doctype html>
<html lang="en">
  <head>
    <!--
      Password-reset links carry a one-time token in the query string. This
      script is the FIRST thing in <head>, so it runs before any image, script
      or telemetry can see the URL: the token is moved to
      window.__gnbResetToken and taken out of the address bar. The address bar
      becomes exactly /reset-password — the other query parameters and the
      fragment go too. The same logic lives in
      src/pages/ResetPassword/resetTokenScrub.js (and is tested there).
    -->
    <script>
      (() => {
        try {
          if (window.location.pathname === '/reset-password') {
            const url = new URL(window.location.href);
            const token = url.searchParams.get('token');
            if (token) {
              window.__gnbResetToken = token;
              window.history.replaceState(window.history.state, '', '/reset-password');
            }
          }
        } catch (e) {
          /* never break the app over this */
        }
      })();
    </script>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/gnb-truck.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- The reset token must not travel to anyone else. -->
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <title>TMS — Fleet Management</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
