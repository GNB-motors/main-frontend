<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GNB Edge · Contact us</title>
<link rel="stylesheet" href="../../assets/ds/colors_and_type.css">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Inter:wght@400;500;600&family=DM+Mono:wght@400&display=swap">
<script src="../../assets/image-slot.js"></script>
<style>

  body { margin:0; background:#F4F5FA; -webkit-font-smoothing:antialiased; }
  a { color: var(--nova-rage-600); text-decoration:none; }
  a:hover { color: var(--nova-rage-700); }
  input, select, textarea { font-family: var(--font-ui); font-size:15px; color:#050816; background:#FFFFFF; border:1px solid rgba(5,8,22,.14); border-radius:12px; padding:14px 16px; width:100%; box-sizing:border-box; outline:none; transition:border-color 200ms cubic-bezier(.2,0,0,1), box-shadow 200ms cubic-bezier(.2,0,0,1); }
  input:focus, select:focus, textarea:focus { border-color:#4469F0; box-shadow:0 0 0 3px rgba(68,105,240,.2); }
  input::placeholder, textarea::placeholder { color:#93939A; }
  @keyframes step-line { from { transform: scaleX(0); } to { transform: scaleX(1); } }

</style>
</head>
<body>
<div style="font-family:var(--font-ui); color:#050816; background:#F4F5FA; overflow-x:hidden">
<section data-screen-label="Contact hero" style="position:relative; background:#F4F5FA; padding:96px 40px 88px; overflow:hidden">
    <div style="position:absolute; inset:0; background:radial-gradient(880px 460px at 50% 0%, rgba(68,105,240,.10), transparent 68%)"></div>
    <div data-reveal-group="" style="position:relative; max-width:900px; margin:0 auto; text-align:center">
      <div style="font-family:var(--font-eyebrow); font-size:12px; font-weight:500; letter-spacing:.44em; text-transform:uppercase; color:var(--nova-rage-600); margin-bottom:24px">Company · Contact us</div>
      <h1 style="font-family:var(--font-display); font-weight:700; font-size:56px; line-height:1.05; letter-spacing:-2px; margin:0; text-wrap:pretty">Tell us what you run. <span style="color:var(--nova-rage-400)">We will show you what changes.</span></h1>
      <p style="font-size:18px; line-height:30px; color:#5D5D5E; margin:28px auto 0; max-width:620px; text-wrap:pretty">One form, one reply from a person who knows fleet operations. No sequence of nurture emails.</p>
    </div>
  </section>
</div>
</body>
</html>
