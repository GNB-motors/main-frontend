<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GNB Edge · Vehicle Tracking</title>
<link rel="stylesheet" href="../../assets/ds/colors_and_type.css">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Inter:wght@400;500;600&family=DM+Mono:wght@400&display=swap">
<script src="../../assets/image-slot.js"></script>
<style>

  body { margin:0; background:#F4F5FA; -webkit-font-smoothing:antialiased; }
  a { color: var(--nova-rage-600); text-decoration:none; }
  a:hover { color: var(--nova-rage-700); }
  @keyframes vt-sweep { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  @keyframes vt-ping { 0% { transform:scale(.4); opacity:.9; } 100% { transform:scale(2.6); opacity:0; } }
  @keyframes ai-flow { from { stroke-dashoffset: 0; } to { stroke-dashoffset: -42; } }
  @keyframes ai-scan { 0% { left:0%; opacity:0; } 6% { opacity:1; } 94% { opacity:1; } 100% { left:100%; opacity:0; } }
  @keyframes ai-blip { 0%,100% { transform:scale(1); opacity:1; } 50% { transform:scale(1.5); opacity:.35; } }

</style>
</head>
<body>
<div style="font-family:var(--font-ui); color:#050816; background:#F4F5FA; overflow-x:hidden">
<section data-screen-label="Tracking hero" style="position:relative; background:#F4F5FA; padding:104px 40px 88px; overflow:hidden">
    <div style="position:absolute; inset:0; background:radial-gradient(880px 500px at 82% 2%, rgba(68,105,240,.11), transparent 68%), radial-gradient(680px 440px at 4% 46%, rgba(68,105,240,.06), transparent 70%)"></div>
    <div style="position:absolute; inset:0; background-image:linear-gradient(rgba(5,8,22,.035) 1px, transparent 1px), linear-gradient(90deg, rgba(5,8,22,.035) 1px, transparent 1px); background-size:72px 72px; mask-image:radial-gradient(circle at 60% 30%, #000, transparent 74%)"></div>

    <div style="position:relative; max-width:1280px; margin:0 auto; display:grid; grid-template-columns:1fr .92fr; gap:64px; align-items:center">
      <div data-reveal-group="">
        <div style="display:flex; align-items:center; gap:14px; margin-bottom:26px">
          <span style="width:44px; height:2px; background:var(--nova-rage-400)"></span>
          <span style="font-family:var(--font-eyebrow); font-size:12px; font-weight:500; letter-spacing:.44em; text-transform:uppercase; color:var(--nova-rage-600)">Platform · Vehicle tracking</span>
          <span style="display:inline-flex; align-items:center; gap:7px; padding:5px 12px; border-radius:999px; background:rgba(68,105,240,.10); border:1px solid rgba(68,105,240,.22); color:#4469F0"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="flex:0 0 auto"><path d="M12 3l1.9 4.6L18.5 9.5 13.9 11.4 12 16l-1.9-4.6L5.5 9.5l4.6-1.9z"></path><path d="M18 16.6l.7 1.7 1.7.7-1.7.7-.7 1.7-.7-1.7-1.7-.7 1.7-.7z"></path></svg><span style="font-family:var(--font-eyebrow); font-size:10px; font-weight:500; letter-spacing:.16em; text-transform:uppercase; color:var(--nova-rage-600)">AI native</span></span>
        </div>
        <h1 style="font-family:var(--font-display); font-weight:700; font-size:58px; line-height:1.05; letter-spacing:-2px; margin:0; text-wrap:pretty">Every vehicle, every trip, <span style="color:var(--nova-rage-400)">on one live map.</span></h1>
        <p style="font-size:18px; line-height:30px; color:#5D5D5E; margin:28px 0 0; max-width:540px; text-wrap:pretty">GPS telemetry refreshed every 30 seconds, geofences that fire on entry and exit, and halt detection that tells you a truck stopped before the customer does.</p>
        <div style="display:flex; gap:14px; margin-top:40px">
          <a href="#vt-demo" style="font-family:var(--font-ui); font-size:16px; font-weight:600; color:#FFFFFF; background:var(--nova-rage-400); border:1px solid var(--nova-rage-800); padding:18px 40px; border-radius:999px; transition:background 200ms cubic-bezier(.2,0,0,1)">Book a demo</a>
          <a href="GNB Edge Landing.html" style="font-family:var(--font-ui); font-size:16px; font-weight:600; color:#050816; background:transparent; border:1px solid rgba(5,8,22,.16); padding:18px 40px; border-radius:999px; transition:background 200ms cubic-bezier(.2,0,0,1)">All modules</a>
        </div>
      </div>

      <div data-reveal="" style="position:relative; border-radius:var(--radius-soft); background:#FFFFFF; border:1px solid rgba(5,8,22,.06); aspect-ratio:1/.92; overflow:hidden; box-shadow:var(--shadow-lg); display:grid; place-items:center">
        <div style="position:relative; width:78%; aspect-ratio:1/1; display:grid; place-items:center">
          <div style="position:absolute; inset:0; border-radius:999px; border:1px solid rgba(68,105,240,.20)"></div>
          <div style="position:absolute; inset:16%; border-radius:999px; border:1px solid rgba(68,105,240,.16)"></div>
          <div style="position:absolute; inset:32%; border-radius:999px; border:1px solid rgba(68,105,240,.12)"></div>
          <div style="position:absolute; inset:0; border-radius:999px; background:conic-gradient(from 0deg, rgba(68,105,240,.20), transparent 32%); animation:vt-sweep 4.2s linear infinite"></div>
          <div style="position:absolute; left:32%; top:26%; width:12px; height:12px; border-radius:999px; background:#4469F0"></div>
          <div style="position:absolute; left:32%; top:26%; width:12px; height:12px; border-radius:999px; background:rgba(68,105,240,.5); animation:vt-ping 2.4s ease-out infinite"></div>
          <div style="position:absolute; left:64%; top:58%; width:10px; height:10px; border-radius:999px; background:#4469F0"></div>
          <div style="position:absolute; left:64%; top:58%; width:10px; height:10px; border-radius:999px; background:rgba(68,105,240,.6); animation:vt-ping 2.4s ease-out infinite .8s"></div>
          <div style="position:absolute; left:48%; top:76%; width:9px; height:9px; border-radius:999px; background:#6366F1"></div>
          <div style="position:absolute; left:48%; top:76%; width:9px; height:9px; border-radius:999px; background:rgba(99,102,241,.6); animation:vt-ping 2.4s ease-out infinite 1.6s"></div>
          <div style="position:relative; width:22%; aspect-ratio:1/1; border-radius:999px; background:linear-gradient(150deg, #4469F0, #213EA7); box-shadow:0 12px 32px rgba(68,105,240,.5); display:grid; place-items:center">
            <svg width="42%" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s7-6.2 7-11a7 7 0 1 0-14 0c0 4.8 7 11 7 11z"></path><circle cx="12" cy="10" r="2.5"></circle></svg>
          </div>
        </div>
      </div>
    </div>
  </section>
</div>
</body>
</html>
