<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GNB Edge · Vehicle Tracking</title>
<link rel="stylesheet" href="../../assets/ds/colors_and_type.css">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Inter:wght@400;500;600&family=DM+Mono:wght@400&display=swap">
<script src="../../assets/image-slot.js"></script>
<style>

  body { margin:0; background:#F4F5FA; -webkit-font-smoothing:antialiased; }
  a { color: var(--nova-rage-600); text-decoration:none; }
  a:hover { color: var(--nova-rage-700); }
  @keyframes vt-sweep { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  @keyframes vt-ping { 0% { transform:scale(.4); opacity:.9; } 100% { transform:scale(2.6); opacity:0; } }
  @keyframes ai-flow { from { stroke-dashoffset: 0; } to { stroke-dashoffset: -42; } }
  @keyframes ai-scan { 0% { left:0%; opacity:0; } 6% { opacity:1; } 94% { opacity:1; } 100% { left:100%; opacity:0; } }
  @keyframes ai-blip { 0%,100% { transform:scale(1); opacity:1; } 50% { transform:scale(1.5); opacity:.35; } }

</style>
</head>
<body>
<div style="font-family:var(--font-ui); color:#050816; background:#F4F5FA; overflow-x:hidden">
<section data-screen-label="Tracking specs" style="background:#FFFFFF; padding:88px 40px 96px">
    <div data-reveal-group="" style="max-width:1280px; margin:0 auto; display:grid; grid-template-columns:repeat(4,1fr); gap:24px">
      <div style="padding-left:22px; border-left:2px solid var(--nova-rage-400)">
        <div style="font-family:var(--font-display); font-weight:700; font-size:44px; line-height:1; letter-spacing:-1.6px">30 s</div>
        <div style="font-size:15px; line-height:23px; color:#5D5D5E; margin-top:14px">Telemetry refresh interval</div>
      </div>
      <div style="padding-left:22px; border-left:2px solid rgba(5,8,22,.10)">
        <div style="font-family:var(--font-display); font-weight:700; font-size:44px; line-height:1; letter-spacing:-1.6px">±5 m</div>
        <div style="font-size:15px; line-height:23px; color:#5D5D5E; margin-top:14px">Positional accuracy, open sky</div>
      </div>
      <div style="padding-left:22px; border-left:2px solid rgba(5,8,22,.10)">
        <div style="font-family:var(--font-display); font-weight:700; font-size:44px; line-height:1; letter-spacing:-1.6px">90 d</div>
        <div style="font-size:15px; line-height:23px; color:#5D5D5E; margin-top:14px">Route history retained by default</div>
      </div>
      <div style="padding-left:22px; border-left:2px solid rgba(5,8,22,.10)">
        <div style="font-family:var(--font-display); font-weight:700; font-size:44px; line-height:1; letter-spacing:-1.6px">4 G</div>
        <div style="font-size:15px; line-height:23px; color:#5D5D5E; margin-top:14px">Device uplink, with offline buffering</div>
      </div>
    </div>
  </section>
</div>
</body>
</html>
