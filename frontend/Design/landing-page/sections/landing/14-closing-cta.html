<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GNB Edge · GNB Edge Landing</title>
<link rel="stylesheet" href="../../assets/ds/colors_and_type.css">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Inter:wght@400;500;600&family=DM+Mono:wght@400&display=swap">
<script src="../../assets/image-slot.js"></script>
<style>

  body { margin:0; background:#F4F5FA; -webkit-font-smoothing:antialiased; }
  a { color: var(--nova-rage-600); text-decoration:none; }
  a:hover { color: var(--nova-rage-700); }
  @keyframes gnb-flow { from { stroke-dashoffset: 0; } to { stroke-dashoffset: -248; } }
  @keyframes arch-flow { from { stroke-dashoffset: 0; } to { stroke-dashoffset: -200; } }
  @keyframes arch-orb { 0%,100% { transform:scale(1); opacity:.5; } 50% { transform:scale(1.14); opacity:.28; } }
  @keyframes gnb-orb { 0%,100% { transform:scale(1); opacity:.5; } 50% { transform:scale(1.14); opacity:.28; } }
  @keyframes ai-flow { from { stroke-dashoffset: 0; } to { stroke-dashoffset: -42; } }
  @keyframes cap-run { from { offset-distance:0%; } to { offset-distance:100%; } }
  @keyframes cap-draw { 0% { stroke-dashoffset:520; } 45%, 78% { stroke-dashoffset:0; } 100% { stroke-dashoffset:-520; } }
  @keyframes cap-flow { from { stroke-dashoffset:0; } to { stroke-dashoffset:-170; } }
  @keyframes cap-geo { 0% { transform:scale(.6); opacity:.9; } 100% { transform:scale(1.25); opacity:0; } }
  @keyframes cap-ring { 0% { transform:scale(.82); opacity:.85; } 100% { transform:scale(1.28); opacity:0; } }
  @keyframes cap-glow { 0%,100% { opacity:.6; transform:scale(1); } 50% { opacity:1; transform:scale(1.08); } }
  @keyframes cap-float { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-7px); } }
  @keyframes cap-blink { 0%,100% { opacity:1; } 50% { opacity:.32; } }
  @keyframes cap-spine { 0% { top:56px; opacity:0; } 12% { opacity:1; } 88% { opacity:1; } 100% { top:calc(100% - 62px); opacity:0; } }
  @keyframes cap-bar { from { transform:scaleX(0); } to { transform:scaleX(1); } }
  @keyframes cap-fade { from { opacity:0; } to { opacity:1; } }
  @keyframes cap-doc { 0% { transform:translateY(6px); opacity:.55; } 18%, 82% { transform:none; opacity:1; } 100% { transform:translateY(-6px); opacity:.55; } }
  @keyframes cap-scan { 0% { top:-80px; } 100% { top:100%; } }
  @keyframes cap-insight { 0%, 6% { opacity:.28; transform:translateY(6px); } 14%, 34% { opacity:1; transform:none; } 46%, 100% { opacity:.28; transform:none; } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration:.001ms !important; animation-iteration-count:1 !important; transition-duration:.001ms !important; } }
  body { transition: background-color 420ms cubic-bezier(.2,0,0,1); }
  body[data-theme="dark"] { background:#0B0F20; }
  [data-navshell] { transition: background-color 420ms cubic-bezier(.2,0,0,1), border-color 420ms cubic-bezier(.2,0,0,1); }
  [data-navshell] a, [data-navshell] button, [data-navshell] span { transition: color 420ms cubic-bezier(.2,0,0,1), border-color 420ms cubic-bezier(.2,0,0,1); }
  body[data-theme="dark"] [data-navshell] { background:rgba(11,15,32,.86) !important; border-bottom-color:rgba(255,255,255,.10) !important; }
  body[data-theme="dark"] [data-navshell] a, body[data-theme="dark"] [data-navshell] button { color:rgba(255,255,255,.86) !important; }
  body[data-theme="dark"] [data-navshell] [data-navcta] { color:#FFFFFF !important; }
  @keyframes cap-plane { 0%,100% { transform:perspective(700px) rotateX(24deg) translateY(0); } 50% { transform:perspective(700px) rotateX(24deg) translateY(-5px); } }
  @keyframes cap-drop { 0% { transform:translateY(0); opacity:0; } 15% { opacity:1; } 85% { opacity:1; } 100% { transform:translateY(210px); opacity:0; } }
  @keyframes cap-stamp { 0%, 42% { opacity:0; transform:scale(.7); } 52% { opacity:1; transform:scale(1.08); } 60%, 92% { opacity:1; transform:scale(1); } 100% { opacity:0; transform:scale(1); } }
  [data-card], [data-card-body], [data-card-title], [data-card-desc], [data-dk-h], [data-dk-accent], [data-dk-p], [data-dk-eyebrow], [data-dk-mono], [data-dk-link], [data-dk-pill] { transition: background 700ms cubic-bezier(.2,0,0,1), border-color 700ms cubic-bezier(.2,0,0,1), color 700ms cubic-bezier(.2,0,0,1), box-shadow 700ms cubic-bezier(.2,0,0,1); }
  body:not([data-theme="dark"]) [data-card] { background:#FFFFFF !important; border-color:rgba(5,8,22,.07) !important; box-shadow:0 10px 30px rgba(30,34,56,.10) !important; }
  body:not([data-theme="dark"]) [data-card-body] { border-top-color:rgba(5,8,22,.07) !important; }
  body:not([data-theme="dark"]) [data-card-title], body:not([data-theme="dark"]) [data-dk-h] { color:#050816 !important; }
  body:not([data-theme="dark"]) [data-card-desc], body:not([data-theme="dark"]) [data-dk-p] { color:#5D5D5E !important; }
  body:not([data-theme="dark"]) [data-dk-accent] { color:var(--nova-rage-400) !important; }
  body:not([data-theme="dark"]) [data-dk-eyebrow], body:not([data-theme="dark"]) [data-dk-link] { color:var(--nova-rage-600) !important; }
  body:not([data-theme="dark"]) [data-dk-pill] { background:rgba(68,105,240,.08) !important; border-color:rgba(68,105,240,.22) !important; }
  body:not([data-theme="dark"]) [data-dk-mono] { color:#93939A !important; }

</style>
</head>
<body>
<div style="font-family:var(--font-ui); color:#050816; background:#F4F5FA; overflow-x:hidden">
<section id="demo" data-screen-label="Closing CTA" style="background:#F4F5FA; padding:112px 40px">
    <div data-reveal="" style="max-width:1280px; margin:0 auto; border-radius:var(--radius-ultra-soft); background:linear-gradient(150deg, #2F58EE 0%, #213EA7 100%); padding:88px 80px; position:relative; overflow:hidden">
      <div style="position:absolute; inset:0; background-image:linear-gradient(rgba(255,255,255,.07) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.07) 1px, transparent 1px); background-size:64px 64px; mask-image:radial-gradient(circle at 85% 30%, #000, transparent 70%)"></div>
      <div style="position:relative; max-width:740px">
        <div style="font-family:var(--font-eyebrow); font-size:11px; font-weight:500; letter-spacing:.44em; text-transform:uppercase; color:rgba(255,255,255,.72); margin-bottom:22px">Get started</div>
        <h2 style="font-family:var(--font-display); font-weight:700; font-size:50px; line-height:1.06; letter-spacing:-1.8px; color:#FFFFFF; margin:0; text-wrap:pretty">See your fleet running on one platform.</h2>
        <p style="font-size:19px; line-height:30px; color:rgba(255,255,255,.82); margin:24px 0 40px">Bring your operations, accounts or IT team. We will show how GNB Edge unifies tracking, dispatch, ERP, CRM, GST, ledgers and payments on live data from your own routes.</p>
        <div style="display:flex; gap:14px; flex-wrap:wrap">
          <a href="#demo" style="font-family:var(--font-ui); font-size:16px; font-weight:600; color:#213EA7; background:#FFFFFF; border:1px solid #FFFFFF; padding:18px 40px; border-radius:999px; transition:background 200ms cubic-bezier(.2,0,0,1)">Reach us</a>
          <a href="#demo" style="font-family:var(--font-ui); font-size:16px; font-weight:600; color:#FFFFFF; background:rgba(255,255,255,.12); border:1px solid rgba(255,255,255,.34); padding:18px 40px; border-radius:999px; transition:background 200ms cubic-bezier(.2,0,0,1)">Talk to sales</a>
        </div>
      </div>
    </div>
  </section>
</div>

</html>
