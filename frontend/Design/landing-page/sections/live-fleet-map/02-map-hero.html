<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GNB Edge · Live Fleet Map</title>
<link rel="stylesheet" href="../../assets/ds/colors_and_type.css">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Inter:wght@400;500;600&family=DM+Mono:wght@400&display=swap">
<script src="../../assets/image-slot.js"></script>
<style>

  body { margin:0; background:#F4F5FA; -webkit-font-smoothing:antialiased; }
  a { color: var(--nova-rage-600); text-decoration:none; }
  a:hover { color: var(--nova-rage-700); }
  @keyframes fm-blink { 0%,100% { opacity:1; } 50% { opacity:.3; } }
  @keyframes fm-sweep { 0% { transform:translateX(-100%); } 100% { transform:translateX(100%); } }

</style>
</head>
<body>
<div style="font-family:var(--font-ui); color:#050816; background:#F4F5FA; overflow-x:hidden">
<section data-screen-label="Map hero" style="position:relative; background:#F4F5FA; padding:96px 40px 80px; overflow:hidden">
    <div style="position:absolute; inset:0; background:radial-gradient(880px 500px at 84% 0%, rgba(68,105,240,.12), transparent 68%)"></div>
    <div style="position:absolute; inset:0; background-image:linear-gradient(rgba(5,8,22,.035) 1px, transparent 1px), linear-gradient(90deg, rgba(5,8,22,.035) 1px, transparent 1px); background-size:72px 72px; mask-image:radial-gradient(circle at 20% 0%, #000, transparent 72%)"></div>
    <div data-reveal-group="" style="position:relative; max-width:1280px; margin:0 auto">
      <div style="font-family:var(--font-eyebrow); font-size:11px; font-weight:500; letter-spacing:.44em; text-transform:uppercase; color:var(--nova-rage-600); margin-bottom:22px">Platform · Live fleet map</div>
      <h1 style="font-family:var(--font-display); font-weight:700; font-size:58px; line-height:1.05; letter-spacing:-2px; margin:0; max-width:900px; text-wrap:pretty">Every vehicle, every trip, <span style="color:var(--nova-rage-400)">on one live map.</span></h1>
      <p style="font-size:18px; line-height:30px; color:#5D5D5E; margin:26px 0 0; max-width:660px; text-wrap:pretty">Telemetry from every truck lands on one map with the trip, the driver and the consignment attached to the pin. Dispatch stops calling drivers to ask where the vehicle is.</p>
      <div style="display:flex; flex-wrap:wrap; gap:12px; margin-top:36px">
        <span style="display:inline-flex; align-items:center; gap:9px; padding:10px 16px; border-radius:999px; background:#FFFFFF; border:1px solid rgba(5,8,22,.07); box-shadow:var(--shadow-xs)">
          <span style="width:7px; height:7px; border-radius:999px; background:#4469F0; box-shadow:0 0 0 4px rgba(68,105,240,.14)"></span>
          <span style="font-size:13.5px; font-weight:500; color:#050816">1,043 moving</span>
        </span>
        <span style="display:inline-flex; align-items:center; gap:9px; padding:10px 16px; border-radius:999px; background:#FFFFFF; border:1px solid rgba(5,8,22,.07); box-shadow:var(--shadow-xs)">
          <span style="width:7px; height:7px; border-radius:999px; background:#E5686B; box-shadow:0 0 0 4px rgba(229,104,107,.14); animation:fm-blink 2s ease-in-out infinite"></span>
          <span style="font-size:13.5px; font-weight:500; color:#050816">118 halted</span>
        </span>
        <span style="display:inline-flex; align-items:center; gap:9px; padding:10px 16px; border-radius:999px; background:#FFFFFF; border:1px solid rgba(5,8,22,.07); box-shadow:var(--shadow-xs)">
          <span style="width:7px; height:7px; border-radius:999px; background:#F9A061; box-shadow:0 0 0 4px rgba(249,160,97,.16)"></span>
          <span style="font-size:13.5px; font-weight:500; color:#050816">79 idle</span>
        </span>
        <span style="display:inline-flex; align-items:center; gap:9px; padding:10px 16px; border-radius:999px; background:rgba(68,105,240,.07); border:1px solid rgba(68,105,240,.18)">
          <span style="font-family:var(--font-mono); font-size:12px; color:var(--nova-rage-600)">refresh 30 s</span>
        </span>
      </div>
    </div>
  </section>
</div>
</body>
</html>
