<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GNB Edge · About GNB Edge</title>
<link rel="stylesheet" href="../../assets/ds/colors_and_type.css">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Inter:wght@400;500;600&family=DM+Mono:wght@400&display=swap">
<script src="../../assets/image-slot.js"></script>
<style>

  body { margin:0; background:#F4F5FA; -webkit-font-smoothing:antialiased; }
  a { color: var(--nova-rage-600); text-decoration:none; }
  a:hover { color: var(--nova-rage-700); }
  @keyframes step-line { from { transform: scaleX(0); } to { transform: scaleX(1); } }

</style>
</head>
<body>
<div style="font-family:var(--font-ui); color:#050816; background:#F4F5FA; overflow-x:hidden">
<section data-screen-label="About offices" style="background:#FFFFFF; padding:112px 40px">
    <div style="max-width:1280px; margin:0 auto">
      <div data-reveal="" style="display:grid; grid-template-columns:1fr 1fr; gap:64px; align-items:end; margin-bottom:56px">
        <div>
          <div style="font-family:var(--font-eyebrow); font-size:11px; font-weight:500; letter-spacing:.44em; text-transform:uppercase; color:var(--nova-rage-600); margin-bottom:20px">Where we are</div>
          <h2 style="font-family:var(--font-display); font-weight:700; font-size:42px; line-height:1.1; letter-spacing:-1.4px; margin:0; text-wrap:pretty">One office. <span style="color:var(--nova-rage-400)">On the road most weeks.</span></h2>
        </div>
        <p style="font-size:18px; line-height:29px; color:#5D5D5E; margin:0; text-wrap:pretty">We work out of one office in Kolkata, and the implementation team travels to your depots for onboarding rather than doing it over a call.</p>
      </div>
      <div data-reveal="" style="display:grid; grid-template-columns:1fr 1fr; gap:20px; align-items:stretch">
        <div style="background:#F4F5FA; border-radius:var(--radius-xl); padding:34px 32px 36px">
          <div style="font-family:var(--font-eyebrow); font-size:10px; font-weight:500; letter-spacing:.2em; text-transform:uppercase; color:var(--nova-rage-600); margin-bottom:16px">Head office</div>
          <div style="font-family:var(--font-display); font-weight:700; font-size:34px; letter-spacing:-1.2px">Kolkata</div>
          <div style="font-size:16px; line-height:26px; color:#5D5D5E; margin-top:14px; max-width:360px">Add your registered address here</div>
          <div style="display:flex; flex-direction:column; gap:8px; margin-top:24px; padding-top:22px; border-top:1px solid rgba(5,8,22,.1)">
            <span style="font-family:var(--font-mono); font-size:12.5px; color:#5D5D5E">Mon–Sat · 09:30–19:00</span>
            <a href="Contact us.html" style="font-size:15px; font-weight:600">Get in touch →</a>
          </div>
        </div>
        <div style="border-radius:var(--radius-xl); overflow:hidden; box-shadow:var(--shadow-md); min-height:280px">
          <image-slot id="about-office" shape="rect" placeholder="Office or team photo"></image-slot>
        </div>
      </div>
    </div>
    </section>
</div>
</body>
</html>
