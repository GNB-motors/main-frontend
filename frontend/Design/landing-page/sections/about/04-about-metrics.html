<!DOCTYPE html>
<html lang="en">
<head>

<title>GNB Edge · About GNB Edge</title>
<link rel="stylesheet" href="../../assets/ds/colors_and_type.css">

<style>

<div style="font-family:var(--font-ui); color:#050816; background:#F4F5FA; overflow-x:hidden">

      <div style="padding-left:22px; border-left:2px solid var(--nova-rage-400)">

      <div style="padding-left:22px; border-left:2px solid rgba(5,8,22,.10)">

        <div style="font-family:var(--font-display); font-weight:700; font-size:46px; line-height:1; letter-spacing:-1.7px"><span data-count="4" data-suffix=" days">0 days</span></div>
