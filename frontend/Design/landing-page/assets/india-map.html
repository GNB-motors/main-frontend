<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GNB Edge network map</title>
<script src="https://unpkg.com/d3@7.9.0/dist/d3.min.js"></script>
<style>
  html, body { margin:0; height:100%; background:transparent; overflow:hidden; }
  #wrap { width:100%; height:100%; }
  svg { display:block; width:100%; height:100%; }
  @keyframes gnb-pin-drop {
    from { opacity:0; transform: translateY(-22px); }
    to   { opacity:1; transform: translateY(0); }
  }
  .pin { animation: gnb-pin-drop 460ms cubic-bezier(.2,0,0,1) both; }
</style>
</head>
<body>
<div id="wrap"></div>
<script>
const HUBS = [
  { name:"Srinagar",     lat:34.08, lng:74.80, big:false },
  { name:"Ludhiana",     lat:30.90, lng:75.86, big:false },
  { name:"Delhi",        lat:28.61, lng:77.21, big:false },
  { name:"Jaipur",       lat:26.91, lng:75.79, big:false },
  { name:"Lucknow",      lat:26.85, lng:80.95, big:false },
  { name:"Kanpur",       lat:26.45, lng:80.33, big:false },
  { name:"Guwahati",     lat:26.14, lng:91.74, big:false },
  { name:"Ahmedabad",    lat:23.02, lng:72.57, big:false },
  { name:"Indore",       lat:22.72, lng:75.86, big:false },
  { name:"Kolkata",      lat:22.57, lng:88.36, big:false },
  { name:"Nagpur",       lat:21.15, lng:79.09, big:true  },
  { name:"Surat",        lat:21.17, lng:72.83, big:false },
  { name:"Bhubaneswar",  lat:20.30, lng:85.82, big:false },
  { name:"Mumbai",       lat:19.08, lng:72.88, big:false },
  { name:"Pune",         lat:18.52, lng:73.86, big:false },
  { name:"Visakhapatnam",lat:17.69, lng:83.22, big:false },
  { name:"Hyderabad",    lat:17.39, lng:78.49, big:false },
  { name:"Bengaluru",    lat:12.97, lng:77.59, big:false },
  { name:"Chennai",      lat:13.08, lng:80.27, big:false },
  { name:"Coimbatore",   lat:11.02, lng:76.96, big:false },
  { name:"Kochi",        lat:9.93,  lng:76.27, big:false }
];

const PIN = "M0,0 C0,0 -9,-11.4 -9,-17.4 A9,9 0 1,1 9,-17.4 C9,-11.4 0,0 0,0 Z";

// Official Indian boundary (Survey of India, composited with PoK + Shaksgam Valley)
const SOURCES = [
  "https://cdn.jsdelivr.net/gh/datameet/maps@master/Country/india-composite.geojson",
  "https://cdn.jsdelivr.net/gh/datameet/maps@master/Country/india-osm.geojson"
];

// Largest polygon ring by bounding-box span = the mainland (incl. all of J&K).
function mainland(geo) {
  const polys = [];
  const walk = (g) => {
    if (!g) return;
    if (g.type === "FeatureCollection") return g.features.forEach((f) => walk(f.geometry));
    if (g.type === "Feature") return walk(g.geometry);
    if (g.type === "GeometryCollection") return g.geometries.forEach(walk);
    if (g.type === "Polygon") return polys.push(g);
    if (g.type === "MultiPolygon") return g.coordinates.forEach((c) => polys.push({ type: "Polygon", coordinates: c }));
  };
  walk(geo);
  if (!polys.length) return geo;
  let best = polys[0], bestSpan = -1;
  polys.forEach((p) => {
    const b = d3.geoBounds(p);
    const span = (b[1][0] - b[0][0]) * (b[1][1] - b[0][1]);
    if (span > bestSpan) { bestSpan = span; best = p; }
  });
  return best;
}

function draw(geo) {
  const wrap = document.getElementById("wrap");
  const W = wrap.clientWidth || 640;
  const H = wrap.clientHeight || 520;

  const svg = d3.select(wrap).append("svg")
    .attr("viewBox", "0 0 " + W + " " + H)
    .attr("preserveAspectRatio", "xMidYMid meet");

  // Fit on the mainland ring so Andaman/Nicobar + Lakshadweep don't shrink the country.
  const projection = d3.geoMercator().fitExtent([[W * 0.09, H * 0.06], [W * 0.91, H * 0.94]], mainland(geo));
  const path = d3.geoPath(projection);

  const defs = svg.append("defs");
  const shadow = defs.append("filter").attr("id", "pinshadow")
    .attr("x", "-60%").attr("y", "-60%").attr("width", "260%").attr("height", "260%");
  shadow.append("feDropShadow").attr("dx", 0).attr("dy", 2)
    .attr("stdDeviation", 2.4).attr("flood-color", "#050816").attr("flood-opacity", 0.34);

  svg.append("path")
    .datum(geo)
    .attr("d", path)
    .attr("fill", "#FFFFFF")
    .attr("stroke", "rgba(33,62,167,.32)")
    .attr("stroke-width", 0.9)
    .attr("stroke-linejoin", "round");

  const layer = svg.append("g");

  HUBS.forEach((hub, i) => {
    const p = projection([hub.lng, hub.lat]);
    if (!p) return;
    const scale = hub.big ? 1.9 : 1;
    const holder = layer.append("g")
      .attr("transform", "translate(" + p[0] + "," + p[1] + ") scale(" + scale + ")");

    const g = holder.append("g")
      .attr("class", "pin")
      .attr("filter", "url(#pinshadow)")
      .style("animation-delay", (200 + i * 78) + "ms");

    g.append("path").attr("d", PIN).attr("fill", "#050816");
    g.append("circle").attr("cx", 0).attr("cy", -17.4).attr("r", 3.4).attr("fill", "#FFFFFF");
  });
}

async function boot() {
  for (const url of SOURCES) {
    try {
      const geo = await d3.json(url);
      if (geo && (geo.features || geo.type)) { draw(geo); return; }
    } catch (e) { /* try next source */ }
  }
}

let booted = false;
let wasVisible = false;

// Toggling the class (rather than the "animation" shorthand) restarts the
// gnb-pin-drop keyframes without clobbering each pin's inline
// animation-delay, so the staggered drop still replays in order.
function replayPins() {
  const pins = [...document.querySelectorAll('.pin')];
  pins.forEach((el) => el.classList.remove('pin'));
  void document.body.offsetHeight; // reflow: forces the browser to treat the re-add below as a fresh start
  pins.forEach((el) => el.classList.add('pin'));
}

// Intersection here is computed against the top-level viewport, not this
// iframe's own bounding box, so this waits for the user to scroll the map
// into view on the parent page — and replays the pin-drop every time the
// map re-enters view, instead of only once at first load.
function watchVisibility() {
  if (!('IntersectionObserver' in window)) { boot(); return; }
  const io = new IntersectionObserver((entries) => {
    const visible = entries.some((e) => e.isIntersecting);
    if (visible && !wasVisible) {
      if (!booted) { booted = true; boot(); }
      else { replayPins(); }
    }
    wasVisible = visible;
  }, { threshold: 0.1 });
  io.observe(document.body);
}
watchVisibility();
</script>
</body>
</html>
